[project]
name = "bench-ocr"
version = "0.1.0"
description = "OCR benchmark for the gallery: PaddleOCR variants vs EasyOCR on Russian/English text"
requires-python = ">=3.13,<3.14"
dependencies = [
    "paddleocr>=3.7.0,<4",
    "paddlepaddle>=3.3.1,<4",
    "easyocr>=1.7.2",
    "numpy>=2.3.5,<2.4",
    "pillow>=12.3.0",
    "rapidfuzz>=3.9",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "psutil>=6",
    "ipykernel>=6",
    "nbconvert>=7",
]

[tool.uv]
package = false
