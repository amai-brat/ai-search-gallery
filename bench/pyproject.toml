[project]
name = "bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Almaz Shamilov", email = "pepegapeepoclown4head@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "open-clip-torch>=3.3.0",
    "pandas>=3.1.0",
    "psutil>=7.2.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
]

[project.scripts]
bench = "bench:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbconvert>=7.17.2",
]
