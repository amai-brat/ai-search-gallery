services:
    redis:
        container_name: redis
        image: redis/redis-stack:latest
        ports:
        - "6379:6379"
        volumes:
        - ./storage/redis:/data

    pgvector:
        container_name: pgvector
        image: pgvector/pgvector:pg18-trixie
        ports:
        - "5433:5432"
        volumes:
        - ./storage/pgvector:/var/lib/postgresql
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password